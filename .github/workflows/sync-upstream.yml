name: Sync with upstream Tinycast

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-raycast-themes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Raycast Themes branch
        uses: actions/checkout@v4
        with:
          ref: integrate/raycast-themes
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/abue-ammar/tinycast.git
          git fetch upstream main

      - name: Check for upstream changes
        id: check
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into integrate/raycast-themes
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          git merge --no-edit upstream/main

      - name: Push synced Raycast Themes branch
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          git push origin HEAD:integrate/raycast-themes
